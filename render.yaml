services:
  - type: web
    name: niceshot-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: L4D2_HOST
        value: 38.7.197.74
      - key: L4D2_PORT
        value: "25579"
